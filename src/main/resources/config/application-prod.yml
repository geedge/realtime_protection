server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    com.realtime.protection: warn
  file:
    name: log/realtime_protection.log

spring:
  datasource:
    dynamic:
      datasource:
        mysql:
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWD}
          url: jdbc:mysql://${MYSQL_URL:localhost:3306}/realtime_protection?serverTimezone=Asia/Shanghai
          hikari:
            is-auto-commit: false
        doris:
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${DORIS_USERNAME:root}
          password: ${DORIS_PASSWD}
          url: jdbc:mysql://${DORIS_URL:localhost:9030}/command
          hikari:
            is-auto-commit: false
      aop:
        enabled: true
      primary: mysql
      strict: true
      grace-destroy: true
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mappers/*

task:
  pool:
    core-pool-size: 20
    max-pool-size: 400
    queue-capacity: 400
    keep-alive-seconds: 120

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false